services:
  - type: web
    name: razorpay-aegisrisk-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python data/generate_dataset.py && python backend/app/ml/rto_model.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
